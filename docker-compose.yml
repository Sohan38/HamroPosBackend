version: '3.9'

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sohan_manager
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:postgres@db:5432/sohan_manager
      JWT_SECRET: supersecret
      ED25519_PRIVATE_KEY: your-ed25519-private-key
      ED25519_PUBLIC_KEY: your-ed25519-public-key
      ALLOWED_ORIGINS: http://localhost:3000
      ENABLE_ADMIN_BOOTSTRAP: 'true'
      ADMIN_API_KEY: superadmin-bootstrap-key
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:4000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  db-data:
